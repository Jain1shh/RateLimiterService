spring.application.name=ratelimiter
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=6379




management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/ratelimiter?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:yourpassword}


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.task.execution.pool.core-size=5
